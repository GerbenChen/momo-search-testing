name: momo Search Automation

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:

      fail-fast: false

      matrix:
        python-version:
          - "3.11"

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Create Report Directories
        run: |
          mkdir -p reports/html
          mkdir -p reports/traces
          mkdir -p reports/screenshots

      # Wrapped in xvfb-run so the one @pytest.mark.headed test (see
      # "Install Xvfb" above) has a virtual display to launch into.
      # --auto-servernum picks a free display number so this is safe to
      # run even if a previous step already started one.
      - name: Run Playwright Tests
        run: |
          xvfb-run --auto-servernum -- pytest \
          --html=reports/html/report.html \
          --self-contained-html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/html/

      - name: Upload Trace Files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: reports/traces/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: reports/screenshots/
