[pytest]
pythonpath = .

addopts =
    -v
    --html=reports/html/report.html
    --self-contained-html

testpaths = tests

markers =
    smoke: minimal must-pass path, safe to run on every commit
    headed: needs a headed browser; the feature under test does not work headless (see README)
    api: hits momo's HTTP API directly, no browser; fast and stable enough to run on every commit
